services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Primary Database Engine
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: cruise-db-primary
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cruise_db}
      POSTGRES_USER: ${POSTGRES_USER:-cruise_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cruise-network

  # ----------------------------------------------------------------------------
  # Redis In-Memory Cache & Distributed State Store
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cruise-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      - --appendonly
      - "yes"
    ports:
      - "${REDIS_HOST_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cruise-network

volumes:
  postgres_data:
    name: cruise_postgres_data
  redis_data:
    name: cruise_redis_data

networks:
  cruise-network:
    name: cruise-fleet-network
    driver: bridge
