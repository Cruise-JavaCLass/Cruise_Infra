services:
  postgres:
    image: postgres:18-alpine
    container_name: cruise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cruise_db}
      POSTGRES_USER: ${POSTGRES_USER:-cruise_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cruise_secret_password_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cruise_admin} -d ${POSTGRES_DB:-cruise_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cruise-network

  redis:
    image: redis:7-alpine
    container_name: cruise-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secret_password_change_me}
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-redis_secret_password_change_me}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cruise-network

volumes:
  postgres_data:
    name: cruise_postgres_data
  redis_data:
    name: cruise_redis_data

networks:
  cruise-network:
    name: cruise-network
    driver: bridge
